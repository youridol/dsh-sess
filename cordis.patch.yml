# dsh-sess mount patch: inserts the plugin into a profile's layer stack as one
# cordis entry. The row is both the host plugin (package main -> lib/index.js)
# and, through the package's dsh.client declaration, the browser plugin
# (exports "./client" -> client/client.js).
- insert:
    - id: dsh-sess
      name: 'dsh-sess'
